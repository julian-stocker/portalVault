<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="SkyIsles">
  <!--
    The SkyIsles mark. Own artwork: a floating island seen from the side —
    three peaks above, the rock tapering to a keel below, and an arc under it
    for the sky it hangs in. Nothing here is taken from any franchise.

    Drawn as plain paths so it stays sharp at 20 px in a header and costs
    under a kilobyte.
  -->
  <defs>
    <linearGradient id="skyisles-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f6d79a"/>
      <stop offset="45%" stop-color="#e0a44a"/>
      <stop offset="100%" stop-color="#a9761f"/>
    </linearGradient>
  </defs>

  <!-- The sky arc the island hangs in. -->
  <path d="M4 30a20 20 0 0 0 40 0" fill="none" stroke="url(#skyisles-gold)"
        stroke-width="2.5" stroke-linecap="round" opacity="0.55"/>

  <!-- The island: a flat top where something could stand, peaks on it, and
       the rock narrowing to a point underneath. -->
  <path d="M11 24h26l-4.5 7-6 9.5-4.5 6.5-4.2-7-6.8-9z"
        fill="url(#skyisles-gold)" opacity="0.9"/>
  <path d="M11 24 19 11l5.5 7.5L30 7l7 17z" fill="url(#skyisles-gold)"/>
  <!-- The lit edge along the top of the rock. -->
  <path d="M11 24h26" fill="none" stroke="#fff3dc" stroke-width="1.4"
        stroke-linecap="round" opacity="0.75"/>
</svg>
